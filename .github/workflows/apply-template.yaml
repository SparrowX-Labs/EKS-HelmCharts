name: Helm Apply Template

on:
  workflow_call:
    inputs:
      target-env:
        description: Environment dev or prod
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TARGET_ENV: ${{ inputs.target-env }}

jobs:
  helm-apply:
    name: Helm Apply
    runs-on: ubuntu-latest

    steps:
      - name: Validate environment
        env:
          DEV_EKS_CLUSTER_NAME: ${{ vars.DEV_EKS_CLUSTER_NAME }}
          PROD_EKS_CLUSTER_NAME: ${{ vars.PROD_EKS_CLUSTER_NAME }}
        run: |
          set -euo pipefail
          if [[ "$TARGET_ENV" != "dev" && "$TARGET_ENV" != "prod" ]]; then
            echo "Error: Invalid environment '$TARGET_ENV'. Allowed values: dev, prod."
            exit 1
          fi

          if [[ "$TARGET_ENV" == "dev" ]]; then
            EKS_CLUSTER_NAME="$DEV_EKS_CLUSTER_NAME"
          else
            EKS_CLUSTER_NAME="$PROD_EKS_CLUSTER_NAME"
          fi

          echo "EKS_CLUSTER_NAME=$EKS_CLUSTER_NAME" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.AWS_ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve EKS VPC ID
        run: |
          set -euo pipefail
          EKS_VPC_ID="$(aws eks describe-cluster \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --query 'cluster.resourcesVpcConfig.vpcId' \
            --output text)"
          echo "EKS_VPC_ID=$EKS_VPC_ID" >> "$GITHUB_ENV"

      - name: Configure kubeconfig
        run: |
          set -euo pipefail
          aws sts get-caller-identity
          aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"
          kubectl config current-context
          kubectl cluster-info
          kubectl auth can-i get pods --all-namespaces

      - name: Setup Helmfile
        uses: helmfile/helmfile-action@v2.4.8
        with:
          helmfile-version: v1.1.0
          helm-version: v3.18.6
          helm-plugins: https://github.com/databus23/helm-diff@v3.15.11
          helmfile-args: --version

      - name: Apply Helm releases
        env:
          ACM_CERTIFICATE_ARN: ${{ vars.ACM_CERTIFICATE_ARN }}
          ARGOCD_PUBLIC_HOSTNAME: ${{ vars.ARGOCD_PUBLIC_HOSTNAME }}
          ARGOCD_ADMIN_PASSWORD: ${{ secrets.ARGOCD_ADMIN_PASSWORD }}
          ARGOCD_ADMIN_PASSWORD_MTIME: ${{ secrets.ARGOCD_ADMIN_PASSWORD_MTIME }}
          GRAFANA_ADMIN_USER: ${{ vars.GRAFANA_ADMIN_USER }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          GRAFANA_PUBLIC_HOSTNAME: ${{ vars.GRAFANA_PUBLIC_HOSTNAME }}
          PROMETHEUS_ADMIN_USER: ${{ vars.PROMETHEUS_ADMIN_USER }}
          PROMETHEUS_ADMIN_PASSWORD: ${{ secrets.PROMETHEUS_ADMIN_PASSWORD }}
          PROMETHEUS_PUBLIC_HOSTNAME: ${{ vars.PROMETHEUS_PUBLIC_HOSTNAME }}
          PUBLIC_DNS_DOMAIN: ${{ vars.PUBLIC_DNS_DOMAIN }}
        run: |
          set -euo pipefail
          command -v helm
          command -v helmfile
          helm version --short
          helmfile --version
          helmfile -f environments/${{ inputs.target-env }}/main-eks-systems.yaml.gotmpl sync | tee apply.txt
          helmfile -f environments/${{ inputs.target-env }}/argocd.yaml.gotmpl sync | tee -a apply.txt
          helmfile -f environments/${{ inputs.target-env }}/monitoring.yaml.gotmpl sync | tee -a apply.txt

      - name: Add apply to summary
        run: |
          {
            echo "## Helm Apply"
            echo
            echo '```text'
            cat apply.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
